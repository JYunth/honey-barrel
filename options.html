<!DOCTYPE html>
<html>
<head>
  <title>Honey Barrel Options</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    label { display: block; margin-bottom: 5px; }
    input[type="number"] { width: 60px; margin-bottom: 10px; }
    button { padding: 5px 10px; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Honey Barrel Options</h1>

  <label for="threshold">Similarity Threshold (0.1 - 1.0):</label>
  <input type="number" id="threshold" name="threshold" min="0.1" max="1.0" step="0.1">

  <button id="save">Save</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
