<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honey Barrel</title>
  <style>
    :root {
      /* Color Palette from Image */
      --primary-color: #5C3A21; /* Dark brown for title text */
      --button-bg: #1C6D72;    /* Updated teal color */
      --button-hover-bg: #458D91; /* Updated hover color */
      --button-text: #FDFBF5;   /* Light cream for button text (keep) */
      --text-color: #5C3A21;    /* Dark brown for body text */
      --text-light: #8A7460;   /* Lighter brown for secondary text */
      --bg-color: #FDFBF5;      /* Light cream background */
      --secondary-bg: #FAF6F0; /* Off-white for cards/sections */
      --border-color: #EAE0D5; /* Light beige border */
      --savings-bg: #E8F5E9;    /* Light green savings bar background */
      --savings-color-text: #388E3C; /* Darker green savings text */
      --success-color: #28a745; /* Keep for status dot */
      --status-dot-color: #D3CBBF; /* Light gray for default status dot */
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08); /* Subtle shadow */
      --radius: 12px;

      /* Fonts */
      --font-serif: 'Georgia', serif; /* Or 'Playfair Display', serif; */
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* System fonts */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px; /* Keep width */
      padding: 20px; /* Increase padding slightly */
      font-family: var(--font-sans);
      color: var(--text-color);
      background: var(--bg-color);
      line-height: 1.5;
    }

    /* Remove Header border and center content */
    .header {
      display: flex;
      flex-direction: column; /* Stack logo and title */
      align-items: center; /* Center items */
      margin-bottom: 20px; /* Increase spacing */
      /* Removed border-bottom */
    }

    /* Center logo, remove animation */
    .logo {
      font-size: 32px; /* Slightly larger */
      margin: 0 auto 10px; /* Center and add bottom margin */
      color: var(--button-bg); /* Use button color for icon */
      /* Removed animation and transform-origin */
    }

    /* Style main title */
    .title-main {
      font-family: var(--font-serif);
      font-size: 28px; /* Larger title */
      font-weight: 700; /* Bolder */
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 5px; /* Space below title */
    }

    /* Remove title-sub styles */
    /* .title-sub removed */

    /* Remove loading bar styles */
    /* .loading-container removed */
    /* .loading-bar removed */
    /* @keyframes loading-animation removed */

    /* Update status bar */
    .status {
      padding: 12px 16px; /* Adjust padding */
      border-radius: var(--radius);
      background: var(--secondary-bg);
      margin-bottom: 20px; /* Increase spacing */
      font-size: 14px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color); /* Add border */
      color: var(--text-color); /* Use main text color */
      /* Removed transition, position */
    }

    /* Update status dot */
    .status::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: var(--status-dot-color); /* Default light gray */
      border-radius: 50%;
      margin-right: 10px;
    }

    /* Keep success state */
    .status.success::before {
      background-color: var(--success-color);
    }

    /* Remove loading/error/pulse styles for status */
    /* .status.loading::before removed */
    /* .status.error::before removed */
    /* @keyframes pulse removed */


    /* Update matches container */
    .matches {
      max-height: 400px; /* Keep max-height */
      overflow-y: auto;
      /* Remove padding-right */
      /* Optional: Style scrollbar to match theme */
    }

     /* Optional: Themed scrollbar */
    .matches::-webkit-scrollbar {
      width: 6px;
    }
    .matches::-webkit-scrollbar-track {
      background: transparent; /* Or var(--secondary-bg) */
    }
    .matches::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 10px;
    }
    .matches::-webkit-scrollbar-thumb:hover {
      background-color: #d3cbbF; /* Slightly darker */
    }


    /* Update match item card */
    .match-item {
      padding: 16px;
      border-radius: var(--radius);
      background: var(--secondary-bg);
      margin-bottom: 16px; /* Adjust spacing */
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      /* Removed animation, transition, hover */
    }

    /* Remove appear animation */
    /* @keyframes appear removed */

    /* Remove hover effect */
    /* .match-item:hover removed */

    .match-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .match-image {
      width: 80px; /* Slightly larger image */
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 16px; /* More space */
      /* Removed box-shadow */
      border: 1px solid var(--border-color); /* Add subtle border */
    }

    .match-details {
      flex: 1;
    }

    /* Update match name */
    .match-name {
      font-family: var(--font-serif); /* Serif font */
      font-weight: 600;
      font-size: 18px; /* Slightly larger */
      margin-bottom: 4px;
      color: var(--text-color);
      line-height: 1.3;
    }

    /* Update match type */
    .match-type {
      font-size: 13px; /* Slightly larger */
      color: var(--text-light); /* Lighter brown */
      margin-bottom: 4px;
    }

    /* Remove match region styles */
    /* .match-region removed */
    /* .match-region svg removed */

    /* Update price comparison container */
    .price-compare {
      display: flex;
      justify-content: space-between;
      align-items: stretch; /* Make items equal height */
      margin-bottom: 12px;
      font-size: 14px;
      gap: 10px; /* Add gap between items */
    }

    /* Update price comparison items */
    .price-compare-item {
      padding: 12px 14px; /* Adjust padding */
      background: var(--bg-color); /* Use main background */
      border-radius: var(--radius); /* Use main radius */
      border: 1px solid var(--border-color);
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: center; /* Center text */
      /* Removed transition, hover, margin-right */
    }

    /* Remove hover effect */
    /* .price-compare-item:hover removed */

    /* Remove first-child margin */
    /* .price-compare-item:first-child removed */

    /* Update price label */
    .price-label {
      font-size: 12px; /* Slightly larger */
      color: var(--text-light); /* Lighter brown */
      margin-bottom: 4px; /* More space */
    }

    /* Update price value */
    .price-value {
      font-weight: 600;
      font-size: 18px; /* Larger price */
      color: var(--text-color);
    }

/* Update savings bar */
    .savings {
      color: var(--savings-color-text);
      background-color: var(--savings-bg);
      font-weight: 600;
      margin-bottom: 16px; /* More space */
      font-size: 14px; /* Adjust size */
      padding: 10px 14px; /* Adjust padding */
      border-radius: var(--radius); /* Use main radius */
      display: flex;
      align-items: center;
      justify-content: center; /* Center content */
      /* border: 1px solid #c8e6c9; Optional border */
    }

    /* Style icon/arrow in savings */
    .savings span { /* Assuming the arrow is in a span */
      margin-right: 8px;
      font-size: 16px; /* Adjust arrow size */
    }
    /* Update savings bar */
    .savings {
      color: var(--savings-color-text);
      background-color: var(--savings-bg);
      font-weight: 600;
      margin-bottom: 16px; /* More space */
      font-size: 14px; /* Adjust size */
      padding: 10px 14px; /* Adjust padding */
      border-radius: var(--radius); /* Use main radius */
      display: flex;
      align-items: center;
      justify-content: center; /* Center content */
      /* border: 1px solid #c8e6c9; Optional border */
    }

    /* Style icon/arrow in savings */
    .savings span { /* Assuming the arrow is in a span */
      margin-right: 8px;
      font-size: 16px; /* Adjust arrow size */
    }
    /* Remove SVG style */
    /* .savings svg removed */

    /* Update view button */
    .view-btn {
      display: block;
      background: var(--button-bg);
      color: var(--button-text);
      text-decoration: none;
      padding: 12px 16px; /* Adjust padding */
      border-radius: var(--radius); /* Use main radius */
      text-align: center;
      font-weight: 600; /* Bolder */
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none; /* Remove default border */
      font-size: 14px;
    }

    .view-btn:hover {
      background: var(--button-hover-bg);
      transform: translateY(-1px); /* Keep hover effect */
    }

    .view-btn:active {
      transform: translateY(1px); /* Keep active effect */
    }

    /* Style icon/arrow in button */
     .view-btn span { /* Assuming the arrow is in a span */
      margin-left: 8px;
      transition: transform 0.2s ease;
    }
    /* Remove SVG style */
    /* .view-btn svg removed */
    /* .view-btn:hover svg removed */

    /* Update no-matches section */
    .no-matches {
      text-align: center;
      color: var(--text-light); /* Lighter text */
      padding: 40px 20px; /* More padding */
      background: var(--secondary-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color); /* Keep dashed border */
      /* Removed animation */
    }

    /* Remove SVG style */
    /* .no-matches svg removed */

    /* Remove footer styles */
    /* .footer removed */

    /* Remove blurhash styles */
    /* .blurhash-bg removed */
    /* .match-content removed */

    /* Remove spirit badge styles */
    /* .spirit-badge removed */
  </style>
</head>
